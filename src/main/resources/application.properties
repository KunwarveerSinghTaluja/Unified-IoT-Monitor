
# Server Configuration
server.port=8080
server.error.include-stacktrace=never

spring.datasource.url=jdbc:postgresql://localhost:5432/iot_dashboard
spring.datasource.username=postgres
spring.datasource.password=2767
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework=INFO
logging.level.com.iot.dashboard=DEBUG
# Disable security temporarily to test
spring.security.enabled=true

# Debug logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Session
server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=30m

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

